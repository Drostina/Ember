---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '17 4 * * *'
      timezone: "Europe/London"
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Test image cleanup
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Image Name
        id: image-name
        run: |
          IMAGE_NAME=$(just image_name)

          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Default Tag
        id: gen-default-tag
        run: |
          DEFAULT_TAG=$(just generate-default-tag)

          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> $GITHUB_ENV

      - name: Prepare environment
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Require Bazzite signature
        run: |
          set -euo pipefail
          config_dir="$HOME/.config/containers"
          mkdir -p "$config_dir"
          if [ ! -d "$config_dir/registries.d" ]; then
            mkdir -p "$config_dir/registries.d"
            if [ -d /etc/containers/registries.d ]; then
              cp -a /etc/containers/registries.d/. "$config_dir/registries.d/"
            fi
          fi
          install -m644 .github/containers/ublue-os.pub "$config_dir/ublue-os.pub"
          install -m644 .github/containers/bazzite.yaml "$config_dir/registries.d/ember-base.yaml"
          policy_source="$config_dir/policy.json"
          if [ ! -f "$policy_source" ]; then
            policy_source=/etc/containers/policy.json
          fi
          policy_tmp=$(mktemp)
          jq -e --arg key "$config_dir/ublue-os.pub" '
            .transports.docker["ghcr.io/ublue-os/bazzite-gnome-nvidia-open"] = [{
              "type": "sigstoreSigned",
              "keyPath": $key,
              "signedIdentity": {"type": "matchRepository"}
            }]
          ' "$policy_source" > "$policy_tmp"
          install -m644 "$policy_tmp" "$config_dir/policy.json"
          rm "$policy_tmp"

      - name: Build Image
        id: build-image
        run: |
          just build \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      - name: Rechunk with rpm-ostree
        id: rechunk
        run: |
          just ostree-rechunk \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags \
                        ${IMAGE_NAME} \
                        ${DEFAULT_TAG})"

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          just tag-images \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          for tag in ${ALIAS_TAGS}; do
            podman push --digestfile=/tmp/digestfile ${IMAGE_NAME}:${tag} ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}
          done

          digest=$(< /tmp/digestfile)

          echo "digest=${digest}" >> $GITHUB_OUTPUT

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          # be careful when upgrading major versions
          cosign-release: 'v3.1.2'

      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          # https://github.com/containers/container-libs/issues/388
          # https://github.com/coreos/rpm-ostree/issues/5509
          # use old bundle format, so we can use newer cosign 3.X.X instead of 2.X.X
          cosign sign -y --new-bundle-format=false --use-signing-config=false --registry-referrers-mode=legacy --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}

      - name: Verify image signature
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          cosign verify --key cosign.pub --new-bundle-format=false "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Clean up old Ember images and signatures
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: python3 .github/scripts/cleanup-images.py "$PACKAGE_OWNER" ember --protect "$DIGEST" --delete
